/* ============ R1 HANKO — solid stamp pills (Washi light, bold fills) ============ */

.h1-pill[data-status=done] { background: #437742; }
.h1-pill[data-status=next] { background: #d96629; }

.h1-pill[data-status=later] { background: #5a82b3; }
.h1-sec { margin-top: 42px; }
.h1-crumb { color: #7a7160; font-size: 13px; text-decoration: none; }
.h1-chhead { border: 1px solid #e0d4b4; background: #fcf7e9; border-radius: 10px; padding: 18px 20px; }

.h1-part .cnt { font-size: 12.5px; color: #437742; font-weight: 700; margin-left: 10px; }
.h1-partbtns { display: flex; gap: 7px; }
.h1-ptick { border: none; background: #437742; color: #fcf7e9; border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.4px; font-family: inherit; font-weight: 700; }

.d4-meta { font-size: 12px; color: #8fa0c8; margin-top: 2px; }

.d4-pill[data-status=done] { background: #1f5c47; color: #c9f5df; }
.d4-pill[data-status=next] { background: #7a4c2a; color: #ffe2c4; }

.d4-chhead { background: #0e1b3a; border: 1px solid #1d2d55; border-radius: 14px; padding: 18px 20px; }
.d4-chtitle { font-size: 23px; color: #fdc57e; }
.d4-chtitle .ar { font-size: 27px; color: #f3e3bd; margin-left: 12px; }

.d4-chmeta b { color: #7fd6ae; }
.d4-controls { display: flex; gap: 9px; margin-top: 13px; flex-wrap: wrap; align-items: center; }
.d4-btn { border: none; background: #fdc57e; color: #081227; border-radius: 8px; padding: 8px 15px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.d4-btn.o { background: transparent; color: #e8ecf8; border: 1px solid #3a4d7c; font-weight: 400; }
.d4-part { margin: 20px 0 12px; padding: 11px 16px; background: linear-gradient(90deg, rgba(253,197,126,0.12), rgba(253,197,126,0.03)); border: 1px solid #3d335c; border-radius: 12px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.d4-part .no { font-weight: 700; color: #fdc57e; }
.d4-part .range { font-size: 12.5px; color: #aab6d8; margin-left: 10px; }
.d4-part .cnt { font-size: 12.5px; color: #7fd6ae; font-weight: 700; margin-left: 10px; }
.d4-partbtns { display: flex; gap: 7px; }
.d4-ptick { border: none; background: #1f5c47; color: #c9f5df; border-radius: 999px; padding: 4px 11px; font-size: 11.5px; cursor: pointer; font-family: inherit; font-weight: 700; }
.d4-ptick:not([data-on]) { background: transparent; color: #7fd6ae; border: 1px solid #2f6b55; }

.d4-verse { background: #0e1b3a; border: 1px solid #1d2d55; border-radius: 14px; padding: 15px 18px; margin-bottom: 10px; }
.d4-verse.mem { border-left: 3px solid #7fd6ae; background: #0f2145; }
.d4-vtop { display: flex; align-items: center; gap: 9px; }
.d4-vplay { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #3a4d7c; background: transparent; color: #fdc57e; cursor: pointer; font-size: 12px; font-family: inherit; }
.d4-vtick { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #3a4d7c; background: transparent; color: #43537d; cursor: pointer; font-size: 13px; font-family: inherit; }
.d4-vtick[data-on] { background: #1f5c47; border-color: #7fd6ae; color: #c9f5df; }
.d4-vref { font-size: 11px; letter-spacing: 1px; color: #6374a3; }
.d4-var { font-size: 29px; line-height: 2.1; text-align: right; margin: 8px 0 2px; color: #f6e7c2; }
.d4-ven { font-size: 15px; color: #b9c4e2; line-height: 1.55; }
.d4-verse.playing { box-shadow: 0 0 0 2px #fdc57e, 0 0 24px rgba(253,197,126,0.25); }

.rise { animation: protoRise 260ms cubic-bezier(0.16, 1, 0.3, 1) both; }
.rise-1 { animation-delay: 30ms; } .rise-2 { animation-delay: 60ms; } .rise-3 { animation-delay: 90ms; }
@keyframes protoRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .rise, .rise-1, .rise-2, .rise-3 { animation: none; }
  .v3-card { transition: none; }
}
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Hanko</button>
  <button class="proto-picker-item">Nishiki</button>
  <button class="proto-picker-item">Night Ink</button>
  <button class="proto-picker-item">Night Indigo</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">&#8635;</button>
</nav>

<style>
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>

<script>
const DATA = {"surahs": [{"ch": 1, "name": "Al-Fatihah", "ar": "الْفَاتِحَۃِ", "verses": 7}, {"ch": 2, "name": "Al-Baqarah", "ar": " الْبَقَرَۃ", "verses": 287}, {"ch": 4, "name": "An-Nisa'", "ar": "النِّسَآءِ", "verses": 177}, {"ch": 12, "name": "Yusuf", "ar": "یُوْسُفَ", "verses": 112}, {"ch": 18, "name": "Al-Kahf", "ar": "الْکَھْفِ", "verses": 111}, {"ch": 36, "name": "Ya Sin", "ar": "یٰسٓ", "verses": 84}, {"ch": 55, "name": "Ar-Rahman", "ar": "الرَّحْمٰنِ", "verses": 79}, {"ch": 67, "name": "Al-Mulk", "ar": "الْمُلْکِ", "verses": 31}, {"ch": 78, "name": "An-Naba'", "ar": "النَّبَاِ", "verses": 41}, {"ch": 112, "name": "Al-Ikhlas", "ar": "الْاِخْلاَصِ", "verses": 5}, {"ch": 113, "name": "Al-Falaq", "ar": "الْفَلَقِ", "verses": 6}, {"ch": 114, "name": "An-Nas", "ar": "النَّاسِ", "verses": 7}], "verses": [{"n": 1, "ar": "بِسۡمِ اللّٰہِ الرَّحۡمٰنِ الرَّحِیۡمِ ﴿۱﴾", "en": "In the name of Allah, the Gracious, the Merciful."}, {"n": 2, "ar": "الٓـمّٓ ۚ﴿۲﴾", "en": "Alif Lam Mim[✛]."}, {"n": 3, "ar": "ذٰلِکَ الۡکِتٰبُ لَا رَیۡبَ ۚۖۛ فِیۡہِ ۚۛ ہُدًی لِّلۡمُتَّقِیۡنَ ۙ﴿۳﴾", "en": "This is a perfect Book; there is no doubt in it; <i>it is</i> a guidance for the righteous,"}, {"n": 4, "ar": "الَّذِیۡنَ یُؤۡمِنُوۡنَ بِالۡغَیۡبِ وَیُقِیۡمُوۡنَ الصَّلٰوۃَ وَمِمَّا رَزَقۡنٰہُمۡ یُنۡفِقُوۡنَ ۙ﴿۴﴾", "en": "Who believe in the unseen and observe Prayer, and spend out of what We have provided for them;"}, {"n": 5, "ar": "وَالَّذِیۡنَ یُؤۡمِنُوۡنَ بِمَاۤ اُنۡزِلَ اِلَیۡکَ وَمَاۤ اُنۡزِلَ مِنۡ قَبۡلِکَ ۚ وَبِالۡاٰخِرَۃِ ہُمۡ یُوۡقِنُوۡنَ ؕ﴿۵﴾", "en": "And who believe in that which has been revealed to thee, and that which was revealed before thee, and they have firm faith in what is <i>yet</i> to come."}], "demoStatus": {"1": "done", "2": "partial", "4": "next", "12": "later", "18": "next", "36": "unset", "55": "later", "67": "unset", "78": "later", "112": "done", "113": "unset", "114": "partial"}, "demoTicked": {"1": 7, "2": 14, "112": 5, "114": 3}};

const STATUSES = [
  { id: "", label: "Not set" },
  { id: "done", label: "Memorised" },
  { id: "partial", label: "Partial" },
  { id: "next", label: "Next" },
  { id: "later", label: "Later" },
];
const statusInfo = (id) => STATUSES.find((s) => s.id === id) || STATUSES[0];
const AUDIO = "https://files.alislam.cloud/audio/tilawat/ashiq/002-";
const pad3 = (n) => String(n).padStart(3, "0");
const audioUrl = (v) => AUDIO + pad3(v) + "-AR.mp3";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// demo state, reset on each mount
let state = null;
function freshState() {
  return {
    status: { ...DATA.demoStatus },
    ticked: { 2: new Set([1, 2]) },
    filter: "all",
  };
}

function chipRow(cls, dotColor) {
  const counts = { done: 0, partial: 0, next: 0, later: 0 };
  let vDone = 0;
  for (const s of DATA.surahs) {
    const st = state.status[s.ch];
    if (counts[st] !== undefined) { counts[st]++; if (st === "done") vDone += s.verses; }
  }
  return `
  <div class="${cls}-chips">
    <span class="${cls}-chip"><span class="dot" style="background:#3f7d4e"></span>Memorised ${counts.done} · ${vDone.toLocaleString()} v</span>
    <span class="${cls}-chip"><span class="dot" style="background:#d5648a"></span>Partial ${counts.partial}</span>
    <span class="${cls}-chip"><span class="dot" style="background:#c96f2a"></span>Next ${counts.next}</span>
    <span class="${cls}-chip"><span class="dot" style="background:#4a6fa5"></span>Later ${counts.later}</span>
  </div>`;
}

function visibleSurahs() {
  if (state.filter === "all") return DATA.surahs;
  if (state.filter === "unset") return DATA.surahs.filter((s) => !state.status[s.ch]);
  return DATA.surahs.filter((s) => state.status[s.ch] === state.filter);
}

/* ============ variant renderers ============ */

function makeRenderer(cls, subtitle, brandHtml, options = {}) {
  const dark = !!options.dark;
  const cards = visibleSurahs().map((s, i) => `
    <div class="${cls}-card rise ${i < 4 ? "rise-" + (i % 3 + 1) : ""}" data-status="${state.status[s.ch] || ""}" data-ch="${s.ch}">
      <div class="${cls}-card-top"><span class="${cls}-num">${s.ch}</span><span class="${cls}-cardar ar">${esc(s.ar)}</span></div>
      <div class="${cls}-name">${esc(s.name)}</div>
      <div class="${cls}-meta">${s.verses} verses${DATA.demoTicked[s.ch] ? ` · <span class="tick">${DATA.demoTicked[s.ch]}✓</span>` : ""}</div>
      <button class="${cls}-pill p-status" data-status="${state.status[s.ch] || ""}" data-ch="${s.ch}">${statusInfo(state.status[s.ch] || "").label}</button>
    </div>`).join("");
  const verses = DATA.verses.map((v) => verseRow(cls, v)).join("");
  return `
  <div class="${cls}">
    <header class="${cls}-top rise">
      <div>${brandHtml}<div class="${cls}-sub">${subtitle}</div></div>
      ${chipRow(cls)}
    </header>
    <main class="${cls}-main">
      <div class="${cls}-filters rise-1">${filters(cls)}</div>
      <div class="${cls}-grid rise-2">${cards}</div>
      <section class="${cls}-sec">
        <a class="${cls}-crumb" href="#" onclick="return false">← All chapters</a>
        <div class="${cls}-chhead rise-3">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center">
            <div class="${cls}-chtitle">2. Al-Baqarah <span class="ar">${esc(DATA.surahs[1].ar)}</span></div>
            <button class="${cls}-pill p-status" data-status="${state.status[2]}" data-ch="2">${statusInfo(state.status[2]).label}</button>
          </div>
          <div class="${cls}-chmeta">287 verses · <b>14/287 verses memorised</b></div>
          <div class="${cls}-controls">
            <button class="${cls}-btn p-playpart">▶ Play part</button>
            <button class="${cls}-btn o">Sher Ali</button>
          </div>
        </div>
        ${partHeader(cls)}
        ${verses}
      </section>
    </main>
  </div>`;
}

function renderHanko() {
  return makeRenderer("h1", "Hanko — Washi with solid stamp seals (Wada 190)",
    '<div class="h1-brand"><span class="mark">۞</span>Quran Memoriser</div>');
}
function renderNishiki() {
  return makeRenderer("n2", "Nishiki — colour-washed cards, solid pills (Wada 190)",
    '<div class="n2-brand"><span class="mark">۞</span>Quran Memoriser</div>');
}
function renderNightInk() {
  return makeRenderer("d3", "Night Ink — Washi after dark · gold accents",
    '<div class="d3-brand"><span class="mark">۞</span>Quran Memoriser</div>');
}
function renderNightIndigo() {
  return makeRenderer("d4", "Night Indigo — Deep Indigo · Cinnamon Buff (Wada 344/211)",
    '<div class="d4-brand">۞ Quran Memoriser</div>');
}

function filters(cls) {
  const defs = [["all", "All"], ["done", "Memorised"], ["partial", "Partial"], ["next", "Next"], ["later", "Later"], ["unset", "Not set"]];
  return defs.map(([id, label]) =>
    `<button class="${cls}-filter p-filter" data-f="${id}" ${state.filter === id ? "data-active" : ""}>${label}</button>`).join("");
}

function verseRow(cls, v) {
  const on = state.ticked[2].has(v.n);
  return `
  <div class="${cls}-verse ${on ? "mem" : ""}" data-v="${v.n}">
    <div class="${cls}-vtop">
      <button class="${cls}-vplay p-play" data-v="${v.n}" title="Play 2:${v.n}">▶</button>
      <button class="${cls}-vtick p-tick" data-v="${v.n}" ${on ? "data-on" : ""} title="Mark memorised">✓</button>
      <span class="${cls}-vref">2 : ${v.n}</span>
    </div>
    <div class="${cls}-var ar">${esc(v.ar)}</div>
    <div class="${cls}-ven">${esc(v.en)}</div>
  </div>`;
}

function partHeader(cls) {
  const total = 14, done = state.ticked[2].size;
  const on = done === total;
  return `
  <div class="${cls}-part">
    <div><span class="no">Part 1 of 42</span><span class="range">verses 2:1–14 · 159 words</span><span class="cnt p-partcount">${done}/${total} verses ✓</span></div>
    <div class="${cls}-partbtns">
      <button class="${cls}-ptick p-parttick" ${on ? "data-on" : ""}>${on ? "✓ Memorised" : "Mark memorised"}</button>
      <button class="${cls}-pplay p-playpart">▶ Play part</button>
    </div>
  </div>`;
}

/* ============ interactions (delegated, wired after each mount) ============ */

let audio = null;
function stopAudio() {
  if (audio) { audio.pause(); audio = null; }
  document.querySelectorAll(".playing").forEach((n) => n.classList.remove("playing"));
}

function playVerse(v) {
  stopAudio();
  audio = new Audio(audioUrl(v));
  audio.addEventListener("ended", stopAudio);
  audio.play().catch(() => {});
  const row = document.querySelector(`.verse[data-v="${v}"], [class*="-verse"][data-v="${v}"]`);
  if (row) row.classList.add("playing");
}

function wireInteractions(root) {
  root.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.classList.contains("p-status")) {
      const order = ["", "done", "partial", "next", "later"];
      const ch = String(t.dataset.ch);
      const next = order[(order.indexOf(t.dataset.status || "") + 1) % order.length];
      state.status[ch] = next;
      t.dataset.status = next;
      t.textContent = statusInfo(next).label;
      const card = root.querySelector(`[data-ch="${ch}"]`);
      if (card && card !== t) card.dataset.status = next;
      const chips = root.querySelector('[class*="-chips"]');
      if (chips) chips.outerHTML = chipRow(chips.className.split("-")[0]);
      return;
    }
    if (t.classList.contains("p-tick")) {
      const v = +t.dataset.v;
      const set = state.ticked[2];
      if (set.has(v)) { set.delete(v); t.removeAttribute("data-on"); }
      else { set.add(v); t.setAttribute("data-on", ""); }
      const row = t.closest('[class*="-verse"]');
      if (row) row.classList.toggle("mem", set.has(v));
      const cnt = root.querySelector(".p-partcount");
      if (cnt) cnt.textContent = `${set.size}/14 verses ✓`;
      const ptick = root.querySelector(".p-parttick");
      if (ptick) {
        const on = set.size === 14;
        ptick.toggleAttribute("data-on", on);
        ptick.textContent = on ? "✓ Memorised" : "Mark memorised";
      }
      return;
    }
    if (t.classList.contains("p-parttick")) {
      const set = state.ticked[2];
      const on = set.size !== 14;
      set.clear();
      if (on) DATA.verses.forEach((v) => set.add(v.n));
      root.querySelectorAll(".p-tick").forEach((b) => {
        b.toggleAttribute("data-on", set.has(+b.dataset.v));
        const row = b.closest('[class*="-verse"]');
        if (row) row.classList.toggle("mem", set.has(+b.dataset.v));
      });
      const cnt = root.querySelector(".p-partcount");
      if (cnt) cnt.textContent = `${set.size}/14 verses ✓`;
      t.toggleAttribute("data-on", set.size === 14);
      t.textContent = set.size === 14 ? "✓ Memorised" : "Mark memorised";
      return;
    }
    if (t.classList.contains("p-play")) { playVerse(+t.dataset.v); return; }
    if (t.classList.contains("p-playpart")) {
      stopAudio();
      const order = [...DATA.verses.map((v) => v.n)];
      let i = 0;
      const playNext = () => {
        if (i >= order.length) return stopAudio();
        const v = order[i++];
        stopAudio();
        audio = new Audio(audioUrl(v));
        audio.addEventListener("ended", playNext);
        audio.play().catch(() => {});
        const row = document.querySelector(`[class*="-verse"][data-v="${v}"]`);
        if (row) { document.querySelectorAll(".playing").forEach((n) => n.classList.remove("playing")); row.classList.add("playing"); }
      };
      playNext();
      return;
    }
    if (t.classList.contains("p-filter")) {
      state.filter = t.dataset.f;
      remount();
    }
  });
}

const variants = [renderHanko, renderNishiki, renderNightInk, renderNightIndigo];
const stage = document.getElementById("stage");
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const allItems = [...picker.querySelectorAll(".proto-picker-item")].filter((b) => !b.classList.contains("proto-picker-replay"));
const replayBtn = picker.querySelector(".proto-picker-replay");
let current = 0;
let wired = false;

function moveHighlight() {
  const el = allItems[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function remount() {
  stage.innerHTML = "";
  void stage.offsetHeight; // force reflow so entrance animations re-run (no rAF: hidden tabs never fire it)
  state = freshState();
  const html = variants[current]();
  const holder = document.createElement("div");
  holder.innerHTML = html;
  stage.appendChild(holder.firstElementChild);
  if (!wired) { wireInteractions(stage); wired = true; }
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  allItems.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  moveHighlight();
  try {
    const url = new URL(location);
    url.searchParams.set("v", i + 1);
    history.replaceState(null, "", url);
  } catch {}
  remount();
}

allItems.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replayBtn?.addEventListener("click", () => remount());
window.addEventListener("resize", moveHighlight);

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === "r" || e.key === "R") remount();
});

setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
