<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Quran Memoriser</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0e5c46" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quran" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark">۝</span>
      <span>
        <span class="brand-title">Quran Memoriser</span>
        <span class="brand-sub">Text &amp; audio from alislam.org · Sher Ali translation</span>
      </span>
    </a>
    <button id="offline-audio-btn" class="topbar-btn" title="Download reciter audio for offline playback">⤓ Offline audio</button>
    <div id="progress-chips" class="progress-chips"></div>
  </header>

  <main id="view"></main>

  <footer class="footer">
    Quran text, English translation (Maulawi Sher Ali), recitations and the Manzoor Naskh font are served from
    alislam.org / files.alislam.cloud (Ahmadiyya Muslim Community). Verse numbering follows alislam.org's Quran.
  </footer>

  <script src="app.js"></script>
</body>
</html>
